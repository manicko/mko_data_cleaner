# --- Auditor correction note ---
# The plan's §5.3 claims "dict_path property is accessed in one place" but
# it is accessed in TWO: CSVWorker (line 130) AND MappingDict (line 141).
# Both consume the property transparently — the property-modification approach
# handles both correctly. MappingDict uses dict_path only for error messages
# in DictionaryStructureError, so override paths appear in error messages
# (desirable).
#
# get_dictionary() also calls _validate_dictionary_columns(df) after reading;
# the override file will be validated against col_indexes — correct behavior.
#
# Line offsets: get_app_service at line 329 (plan says 327),
# AppService(...) at line 340 (plan says 338). These are cosmetic.
