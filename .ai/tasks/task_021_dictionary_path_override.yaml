# Task: Add --dict-path CLI flag and dict_path parameter to process_data for overriding the dictionary file location

# Source spec: .ai/problems/05_dictionary_path_override_spec.md
# Execution plan: .ai/plans/06-dictionary-path-override.md
# Auditor findings incorporated: dict_path property consumed by TWO components (CSVWorker line 130
#   AND MappingDict line 141), not one. get_dictionary() also calls _validate_dictionary_columns.
#   Line numbers: get_app_service at 329 (not 327), AppService(...) at 340 (not 338).

id: task_021

title: Add dict_path override parameter to AppService, get_app_service, CLI run, and process_data

priority: high

depends_on:
  - (none — leaf feature, no dependencies)

source_reference: .ai/problems/05_dictionary_path_override_spec.md
source_section: §3 Conceptual Development Tasks (T1–T7); §6 Proposed Changes (Approach B)

description: >
  Add a `dict_path` parameter that allows users to specify an alternative
  single-file dictionary path via a CLI flag (`--dict-path`) or the Python API
  (`process_data(dict_path=...)`). When provided, the dictionary is read from
  the specified file instead of the default `<report_dir>/dict/merged_dictionary.csv`.
  Relative paths resolve against the report directory (Q1=(b)); absolute paths
  are accepted as-is. When the override file does not exist, a clear
  FileNotFoundError is raised showing the resolved path searched (Q2=(a)).
  When no flag is given, behavior is identical to today (backward compatible).
  Approach B (factory parameter) selected: thread dict_path through
  get_app_service() -> AppService.__init__ -> dict_path property.

goals:
  - AppService.__init__ accepts and stores dict_path: Path | None = None
  - dict_path property resolves override against base_path (report dir)
  - get_app_service accepts and passes dict_path to AppService
  - CLI run command accepts --dict-path Typer Option (exists=False, dir_okay=False)
  - process_data() accepts dict_path parameter, threads to get_app_service
  - run_report raises FileNotFoundError with resolved path when override file missing
  - All existing tests pass with one mock lambda update
  - 5 new tests cover: override success, default unchanged, missing-file error,
    CLI end-to-end, relative-path resolution
  - Lint and type checks pass

files:
  - path: src/mko_data_cleaner/core/app_service.py
    targets:
      - type: class
        name: AppService
      - type: method
        name: __init__
      - type: method
        name: dict_path
      - type: method
        name: run_report
      - type: function
        name: get_app_service

  - path: src/mko_data_cleaner/app.py
    targets:
      - type: function
        name: run
      - type: function
        name: process_data

  - path: tests/test_app.py
    targets:
      - type: function
        name: test_process_data_returns_report_result
      - type: fixture
        name: external_dict_file
    new_tests:
      - test_process_data_with_dict_path_override
      - test_process_data_without_dict_path_uses_default
      - test_process_data_dict_path_missing_raises_filenotfound
      - test_run_cli_with_dict_path
      - test_dict_path_relative_resolves_against_report_dir

  - path: tests/conftest.py
    targets:
      - type: fixture
        name: external_dict_file

changes:

  # --- T1: AppService.__init__ + dict_path property + existence check ---
  - action: add_dict_path_to_init
    file: src/mko_data_cleaner/core/app_service.py
    description: >
      In AppService.__init__, add `dict_path: Path | None = None` parameter.
      Store `self._dict_path = dict_path` alongside `self._base_path = None`.
      Import Path (already imported via `from pathlib import Path`).
    code_hint: |
      def __init__(self, app_paths: AppPaths, resolver: PathResolver, dict_path: Path | None = None):
          self.app_paths = app_paths
          self.resolver = resolver
          self.prepare_log_paths()
          self._base_path = None
          self._dict_path = dict_path

  - action: modify_dict_path_property
    file: src/mko_data_cleaner/core/app_service.py
    description: >
      In the dict_path property, add a guard before the existing return:
      if self._dict_path is not None, return Path(self.base_path, self._dict_path).
      This resolves relative paths against base_path (report dir) and keeps
      absolute paths as-is (pathlib behavior). When _dict_path is None, falls
      through to existing config default.
    code_hint: |
      @property
      def dict_path(self) -> Path:
          if self._dict_path is not None:
              return Path(self.base_path, self._dict_path)
          return Path(self.base_path, self.app_config.data_paths.dict_file)

  - action: add_existence_check_in_run_report
    file: src/mko_data_cleaner/core/app_service.py
    description: >
      In run_report, after `self.base_path = data_path` (line 117) and before
      ensure_file_parent/CSVWorker construction (line 126+), add:
      if self._dict_path is not None and not self.dict_path.is_file():
          raise FileNotFoundError(...)
      Error message includes: override path, resolved path, searched-at (absolute),
      and guidance to remove the override to use the default.
    code_hint: |
      self.base_path = data_path
      if self._dict_path is not None and not self.dict_path.is_file():
          raise FileNotFoundError(
              f"Dictionary file not found.\n"
              f"  Override path: {self._dict_path}\n"
              f"  Resolved path: {self.dict_path}\n"
              f"  Searched at: {self.dict_path.resolve()}\n"
              f"Remove --dict-path / dict_path parameter to use the default "
              f"(<report_dir>/{self.app_config.data_paths.dict_file})."
          )

  # --- T2: CLI run command ---
  - action: add_dict_path_cli_option
    file: src/mko_data_cleaner/app.py
    description: >
      Add dict_path as a Typer Option to the run command. Use exists=False
      (validation deferred to run_report where base_path is available for
      report-dir-relative resolution per Q1). dir_okay=False (must be a file).
      Add `from typing import Annotated` import if not present (it is).
    code_hint: |
      dict_path: Annotated[
          Path | None,
          typer.Option(
              exists=False,
              file_okay=True,
              dir_okay=False,
              help="Override the dictionary file path (default: <report_dir>/dict/merged_dictionary.csv). "
                   "Relative paths resolve against the report directory.",
          ),
      ] = None,

  - action: thread_dict_path_to_get_app_service_in_run
    file: src/mko_data_cleaner/app.py
    description: >
      Change line 77 from `service = get_app_service(settings_dir)`
      to `service = get_app_service(settings_dir, dict_path=dict_path)`.

  # --- T3: process_data API ---
  - action: add_dict_path_to_process_data
    file: src/mko_data_cleaner/app.py
    description: >
      Add `dict_path: Path | None = None` parameter to process_data signature.
      Thread it to get_app_service: `get_app_service(settings_dir, dict_path=dict_path).run_report(path)`.

  # --- T4: get_app_service factory ---
  - action: add_dict_path_to_get_app_service
    file: src/mko_data_cleaner/core/app_service.py
    description: >
      In get_app_service, add `dict_path: Path | None = None` parameter.
      Pass to AppService: `AppService(app_paths=app_paths, resolver=PathResolver(app_paths.user_dir), dict_path=dict_path)`.

  # --- T5: Update existing mock test ---
  - action: update_mock_lambda
    file: tests/test_app.py
    description: >
      Update the mock lambda at line 310 from
      `lambda settings_dir=None: fake_service`
      to `lambda settings_dir=None, dict_path=None: fake_service`.
      No change needed to assert_called_once_with at line 316 — run_report
      signature is unchanged in Approach B.

  # --- T6: New tests ---
  - action: add_external_dict_file_fixture
    file: tests/conftest.py
    description: >
      Add a fixture that creates a merged_dictionary.csv in tmp_path but OUTSIDE
      the report directory, so tests can verify the override points to an
      external file. The dictionary content matches the synthetic_report
      dictionary (DELETE Brand2, ADD "added_by_brand" to Brand1).
    code_hint: |
      @pytest.fixture
      def external_dict_file(tmp_path: Path) -> Path:
          """A merged_dictionary.csv placed outside the report directory."""
          file_path = tmp_path / "external_dict" / "merged_dictionary.csv"
          file_path.parent.mkdir(parents=True)
          dict_lines = [
              "action;match;search;value;term;tag",
              "d;f;4;NULL;Brand2;",
              "a;f;4;NULL;Brand1;added_by_brand",
          ]
          file_path.write_text("\n".join(dict_lines) + "\n", encoding="utf-8")
          return file_path

  - action: add_test_dict_path_override
    file: tests/test_app.py
    description: >
      test_process_data_with_dict_path_override: process_data with dict_path
      pointing to external_dict_file should use that file and produce correct
      results (Brand2 deleted, Brand1 kept with tag). Uses synthetic_report
      (which has its own dict) but passes a different external dict.

  - action: add_test_default_unchanged
    file: tests/test_app.py
    description: >
      test_process_data_without_dict_path_uses_default: process_data WITHOUT
      dict_path uses the default report-dir dict. Verify results match
      existing end-to-end behavior (rows_loaded=3, rows_exported=2).

  - action: add_test_missing_dict_path_raises
    file: tests/test_app.py
    description: >
      test_process_data_dict_path_missing_raises_filenotfound: when dict_path
      points to a non-existent file, raises FileNotFoundError whose message
      contains the resolved path and "Dictionary file not found".

  - action: add_test_cli_dict_path
    file: tests/test_app.py
    description: >
      test_run_cli_with_dict_path: CLI run with --dict-path pointing to
      external_dict_file succeeds and uses the override.

  - action: add_test_relative_dict_path_resolution
    file: tests/test_app.py
    description: >
      test_dict_path_relative_resolves_against_report_dir: relative dict_path
      "custom_dict.csv" placed in the report dir is resolved against the
      report dir (Q1). Verify the override file is used.

